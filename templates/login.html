{% extends "base.html" %}

{% block page_content %}
<section class="auth-login-shell">
    <div class="auth-login-card">
        <div class="app-logo-mark" aria-hidden="true">
            <span>ALZ</span>
        </div>
        <div class="mock-login-copy">
            <p class="section-kicker">Caregiver Access</p>
            <h1>家庭照护者登录</h1>
            <p class="subtitle">请选择照护者身份并输入 4 位 PIN 码，进入患者管理与照护工作台。</p>
        </div>

        <form id="login-form" class="mock-login-form">
            <label class="field">
                <span>照护者</span>
                <select id="login-caregiver-id" required>
                    {% for caregiver in caregivers %}
                    <option value="{{ caregiver.id }}">{{ caregiver.avatar_emoji }} {{ caregiver.name }} · {{ caregiver.role }}</option>
                    {% endfor %}
                </select>
            </label>

            <label class="field">
                <span>PIN 码</span>
                <input id="login-pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="请输入 4 位 PIN" required>
            </label>

            <button type="submit" class="login-continue-button">登录并进入患者列表</button>
            <p id="error-msg" style="color:red;display:none;"></p>
            <p id="login-status" class="summary-note-text" aria-live="polite"></p>
        </form>

        <div class="mock-login-links auth-login-note">
            <span>首次使用提示：默认 PIN 码为 0000，登录后可在设置中修改。</span>
        </div>
    </div>
</section>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const form = document.getElementById("login-form");
    const caregiverInput = document.getElementById("login-caregiver-id");
    const pinInput = document.getElementById("login-pin");
    const status = document.getElementById("login-status");
    const errorMsg = document.getElementById("error-msg");

    form?.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorMsg.style.display = "none";
        errorMsg.textContent = "";
        status.textContent = "正在登录...";
        try {
            const response = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    caregiver_id: caregiverInput.value,
                    pin: pinInput.value.trim(),
                }),
            });
            const data = await response.json();
            if (!response.ok || !data.ok) {
                errorMsg.textContent = data.detail || data.message || "PIN 码错误，请重试";
                errorMsg.style.display = "block";
                status.textContent = "";
                pinInput.focus();
                pinInput.select();
                return;
            }
            window.location.href = data.redirect || "/patients";
        } catch (error) {
            errorMsg.textContent = error.message || "登录失败，请稍后再试。";
            errorMsg.style.display = "block";
            status.textContent = "";
            pinInput.focus();
            pinInput.select();
        }
    });
});
</script>
{% endblock %}
