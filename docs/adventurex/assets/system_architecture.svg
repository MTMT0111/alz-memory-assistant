<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .bg{fill:#ffffff}.box{fill:#f5f7fa;stroke:#cfd8e3;stroke-width:2}.title{font:700 28px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#23445d}.h{font:700 18px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#23445d}.t{font:14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#1f2937}.m{font:12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#4b5563}.line{stroke:#5b7288;stroke-width:2;fill:none;marker-end:url(#a)}.pill{fill:#e8f3f1;stroke:#8cc0ba;stroke-width:1.5}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b7288"/></marker>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="60" y="52" class="title">系统架构：Care Loop + Emotional Memory Companion</text>
  <rect class="box" x="60" y="100" width="250" height="130" rx="18"/>
  <text x="85" y="135" class="h">患者端界面</text>
  <text x="85" y="165" class="t">• 对话页 /conversation</text>
  <text x="85" y="190" class="t">• 语音输入 + TTS 播放</text>
  <text x="85" y="215" class="t">• 照片进入回忆对话</text>
  <rect class="box" x="60" y="280" width="250" height="150" rx="18"/>
  <text x="85" y="315" class="h">家属端界面</text>
  <text x="85" y="345" class="t">• 患者列表 /patients</text>
  <text x="85" y="370" class="t">• 照护工作台 /care-portal</text>
  <text x="85" y="395" class="t">• 素材库 /materials</text>
  <text x="85" y="420" class="t">• 记忆审核 /chat-history</text>
  <rect class="box" x="390" y="90" width="300" height="130" rx="18"/>
  <text x="415" y="125" class="h">身份与患者上下文</text>
  <text x="415" y="155" class="t">• caregiver PIN 登录</text>
  <text x="415" y="180" class="t">• patient_id / access check</text>
  <text x="415" y="205" class="t">• 患者档案与会话上下文投影</text>
  <rect class="box" x="390" y="250" width="300" height="170" rx="18"/>
  <text x="415" y="285" class="h">上下文构建层</text>
  <text x="415" y="315" class="t">• 结构化患者资料</text>
  <text x="415" y="340" class="t">• reminder / medication 状态</text>
  <text x="415" y="365" class="t">• familiar materials / photo story</text>
  <text x="415" y="390" class="t">• recent chat / approved memory</text>
  <rect class="box" x="760" y="90" width="320" height="160" rx="18"/>
  <text x="785" y="125" class="h">LLM 与安全控制</text>
  <text x="785" y="155" class="t">• DeepSeek 主链路</text>
  <text x="785" y="180" class="t">• rule detection / guard</text>
  <text x="785" y="205" class="t">• postprocess / template fallback</text>
  <text x="785" y="230" class="t">• 高风险场景不完全交给模型</text>
  <rect class="box" x="760" y="290" width="320" height="170" rx="18"/>
  <text x="785" y="325" class="h">照护闭环层</text>
  <text x="785" y="355" class="t">• caregiver events / risk events</text>
  <text x="785" y="380" class="t">• daily care summary / trend</text>
  <text x="785" y="405" class="t">• reminder confirmation / overdue notify</text>
  <text x="785" y="430" class="t">• 需要家属处理与确认</text>
  <rect class="box" x="390" y="480" width="300" height="170" rx="18"/>
  <text x="415" y="515" class="h">情感记忆层</text>
  <text x="415" y="545" class="t">• family photos / old places / old songs</text>
  <text x="415" y="570" class="t">• photo story / voice note</text>
  <text x="415" y="595" class="t">• memory candidate → caregiver approval</text>
  <text x="415" y="620" class="t">• sensitive memory 标记</text>
  <rect class="box" x="760" y="520" width="320" height="130" rx="18"/>
  <text x="785" y="555" class="h">数据与外部能力</text>
  <text x="785" y="585" class="t">• SQLite</text>
  <text x="785" y="610" class="t">• MiniMax TTS / 浏览器 fallback</text>
  <text x="785" y="635" class="t">• WeCom / DingTalk webhook</text>
  <path class="line" d="M310 165 H390"/>
  <path class="line" d="M310 350 H390"/>
  <path class="line" d="M690 170 H760"/>
  <path class="line" d="M690 335 H760"/>
  <path class="line" d="M540 420 V480"/>
  <path class="line" d="M920 460 V520"/>
  <path class="line" d="M690 565 H760"/>
  <rect class="pill" x="92" y="668" width="1015" height="46" rx="23"/>
  <text x="115" y="697" class="m">关键原则：LLM 只负责候选自然语言生成；结构化照护事实来自数据库与规则层；长期记忆写入必须经过家属审核。</text>
</svg>