<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>.bg{fill:#fff}.title{font:700 28px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#23445d}.h{font:700 18px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#23445d}.t{font:14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#1f2937}.box{fill:#f5f7fa;stroke:#cfd8e3;stroke-width:2}.accent{fill:#e8f3f1;stroke:#8cc0ba;stroke-width:2}.warn{fill:#fff2e8;stroke:#d8a273;stroke-width:2}.line{stroke:#5b7288;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b7288"/></marker></defs><rect class="bg" width="1200" height="720"/><text x="60" y="52" class="title">Care Loop + Emotional Memory Companion</text><rect class="accent" x="80" y="120" width="280" height="110" rx="18"/><text x="105" y="155" class="h">1. 家属录入家庭记忆</text><text x="105" y="185" class="t">照片、故事、人物、语音说明</text><text x="105" y="210" class="t">形成 familiar materials</text><rect class="accent" x="460" y="120" width="280" height="110" rx="18"/><text x="485" y="155" class="h">2. 患者从熟悉线索进入对话</text><text x="485" y="185" class="t">照片 / 旧歌 / 旧地点触发</text><text x="485" y="210" class="t">温和、非考试式交流</text><rect class="warn" x="840" y="120" width="280" height="110" rx="18"/><text x="865" y="155" class="h">3. 高风险场景切换</text><text x="865" y="185" class="t">用药 / 外出 / 敏感亲人话题</text><text x="865" y="210" class="t">进入 rule guard + fallback</text><rect class="box" x="840" y="310" width="280" height="110" rx="18"/><text x="865" y="345" class="h">4. 结构化照护输出</text><text x="865" y="375" class="t">risk events / reminder status</text><text x="865" y="400" class="t">daily care summary</text><rect class="box" x="460" y="500" width="280" height="110" rx="18"/><text x="485" y="535" class="h">5. 家属审核与处理</text><text x="485" y="565" class="t">memory candidate review</text><text x="485" y="590" class="t">风险提示 / 待确认事项</text><rect class="accent" x="80" y="500" width="280" height="110" rx="18"/><text x="105" y="535" class="h">6. 闭环更新</text><text x="105" y="565" class="t">更好的记忆素材</text><text x="105" y="590" class="t">更连续的家庭照护</text><path class="line" d="M360 175 H460"/><path class="line" d="M740 175 H840"/><path class="line" d="M980 230 V310"/><path class="line" d="M840 365 H740"/><path class="line" d="M460 555 H360"/><path class="line" d="M220 500 V390 C220 300 220 300 220 230"/><text x="415" y="675" class="t">核心命题：从家庭记忆出发，不是为了生成更多话，而是为了进入更安全、更连续的家庭照护闭环。</text></svg>