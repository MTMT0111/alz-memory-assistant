<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>.bg{fill:#fff}.title{font:700 28px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#23445d}.d{font:700 20px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#23445d}.t{font:14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#1f2937}.m{font:12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#4b5563}.box{fill:#f5f7fa;stroke:#cfd8e3;stroke-width:2}.accent{fill:#e8f3f1;stroke:#8cc0ba;stroke-width:2}.line{stroke:#5b7288;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b7288"/></marker></defs><rect class="bg" width="1200" height="720"/><text x="60" y="52" class="title">AdventureX 五天路线图：From Family Memory to Safer Care</text><path class="line" d="M110 160 H1080"/><g transform="translate(80,110)"><circle cx="30" cy="50" r="24" fill="#23445d"/><text x="20" y="57" font-size="20" fill="#fff" font-family="Segoe UI">1</text><rect class="box" x="0" y="100" width="200" height="180" rx="18"/><text x="20" y="135" class="d">Day 1</text><text x="20" y="165" class="t">Reliability & Setup</text><text x="20" y="195" class="m">• patient_id 污染检查</text><text x="20" y="220" class="m">• 重复通知检查</text><text x="20" y="245" class="m">• 测试家庭初始化</text></g><g transform="translate(290,110)"><circle cx="30" cy="50" r="24" fill="#2f6c8e"/><text x="20" y="57" font-size="20" fill="#fff" font-family="Segoe UI">2</text><rect class="accent" x="0" y="100" width="200" height="180" rx="18"/><text x="20" y="135" class="d">Day 2</text><text x="20" y="165" class="t">Family Memory Album</text><text x="20" y="195" class="m">• 照片年份与故事</text><text x="20" y="220" class="m">• 从照片进入对话</text><text x="20" y="245" class="m">• 敏感素材标记</text></g><g transform="translate(500,110)"><circle cx="30" cy="50" r="24" fill="#3f8f88"/><text x="20" y="57" font-size="20" fill="#fff" font-family="Segoe UI">3</text><rect class="accent" x="0" y="100" width="200" height="180" rx="18"/><text x="20" y="135" class="d">Day 3</text><text x="20" y="165" class="t">Voice Grounding</text><text x="20" y="195" class="m">• caregiver voice note</text><text x="20" y="220" class="m">• TTS fallback chain</text><text x="20" y="245" class="m">• 可听化陪伴</text></g><g transform="translate(710,110)"><circle cx="30" cy="50" r="24" fill="#6c8c4e"/><text x="20" y="57" font-size="20" fill="#fff" font-family="Segoe UI">4</text><rect class="box" x="0" y="100" width="200" height="180" rx="18"/><text x="20" y="135" class="d">Day 4</text><text x="20" y="165" class="t">Care Continuity</text><text x="20" y="195" class="m">• daily care ledger</text><text x="20" y="220" class="m">• risk resolution</text><text x="20" y="245" class="m">• memory review 稳定化</text></g><g transform="translate(920,110)"><circle cx="30" cy="50" r="24" fill="#b86a3b"/><text x="20" y="57" font-size="20" fill="#fff" font-family="Segoe UI">5</text><rect class="box" x="0" y="100" width="200" height="180" rx="18"/><text x="20" y="135" class="d">Day 5</text><text x="20" y="165" class="t">User Test & Final Demo</text><text x="20" y="195" class="m">• 3–5 位参与者</text><text x="20" y="220" class="m">• 结构化反馈</text><text x="20" y="245" class="m">• 最终展示与视频</text></g><rect class="box" x="150" y="500" width="900" height="120" rx="18"/><text x="180" y="540" class="d">五天统一目标</text><text x="180" y="575" class="t">在五天结束时完成一个“由家庭照片和语音记忆触发患者对话，并能同步进入家属照护闭环”的可部署 MVP。</text></svg>