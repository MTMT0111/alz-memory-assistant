<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><defs><style>.bg{fill:#fff}.title{font:700 28px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#23445d}.h{font:700 17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#23445d}.t{font:14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#1f2937}.box{fill:#f5f7fa;stroke:#cfd8e3;stroke-width:2}.accent{fill:#e8f3f1;stroke:#8cc0ba;stroke-width:2}.warn{fill:#fff2e8;stroke:#d8a273;stroke-width:2}.line{stroke:#5b7288;stroke-width:2.5;fill:none;marker-end:url(#a)}</style><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b7288"/></marker></defs><rect class="bg" width="1200" height="720"/><text x="60" y="52" class="title">Hero Demo 用户旅程：From Family Memory to Safer Care</text><rect class="box" x="80" y="120" width="210" height="110" rx="18"/><text x="105" y="155" class="h">家属建立患者档案</text><text x="105" y="185" class="t">姓名、关系、病情阶段、提醒</text><rect class="accent" x="330" y="120" width="210" height="110" rx="18"/><text x="355" y="155" class="h">上传照片与故事</text><text x="355" y="185" class="t">年份、人物、故事、标签</text><rect class="accent" x="580" y="120" width="210" height="110" rx="18"/><text x="605" y="155" class="h">录制语音说明</text><text x="605" y="185" class="t">安抚留言 / 照片说明</text><rect class="accent" x="830" y="120" width="290" height="110" rx="18"/><text x="855" y="155" class="h">患者从照片进入回忆对话</text><text x="855" y="185" class="t">看到熟悉人物与过去故事</text><rect class="warn" x="830" y="320" width="290" height="130" rx="18"/><text x="855" y="355" class="h">敏感场景切换</text><text x="855" y="385" class="t">用药 / 外出 / 已故亲人话题</text><text x="855" y="410" class="t">安全控制优先</text><rect class="box" x="520" y="520" width="270" height="120" rx="18"/><text x="545" y="555" class="h">家属收到可行动信息</text><text x="545" y="585" class="t">summary / risk prompt / candidate review</text><rect class="box" x="180" y="520" width="270" height="120" rx="18"/><text x="205" y="555" class="h">新线索进入候选记忆</text><text x="205" y="585" class="t">等待 caregiver 审核后进入长期素材</text><path class="line" d="M290 175 H330"/><path class="line" d="M540 175 H580"/><path class="line" d="M790 175 H830"/><path class="line" d="M975 230 V320"/><path class="line" d="M830 385 H790 C730 385 730 520 730 520"/><path class="line" d="M520 580 H450"/><text x="145" y="680" class="t">这个旅程同时体现：患者端的熟悉感与情绪安抚、家属端的照护价值，以及技术上的上下文、规则、安全和记忆治理。</text></svg>